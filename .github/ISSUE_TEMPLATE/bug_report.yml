name: Bug report
description: Relate um comportamento reproduzível
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes: { value: "Remova tokens, paths privados e conteúdo sensível dos logs." }
  - type: input
    id: version
    attributes: { label: Versão do NOCT, placeholder: "0.1.0 (o nome do instalador traz a versão)" }
    validations: { required: true }
  - type: input
    id: platform
    attributes: { label: "Sistema (Linux e distribuição, Windows ou macOS, com a versão), instalador usado (.deb, AppImage, .exe, .dmg) e modelo do OpenRouter (sem chaves)" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Passos para reproduzir }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Resultado esperado }
  - type: textarea
    id: logs
    attributes: { label: Logs sanitizados }
