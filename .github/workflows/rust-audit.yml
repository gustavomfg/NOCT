name: Rust dependency audit

# Supply-chain checks for the Rust workspace. `cargo deny` applies the policy in deny.toml to
# advisories, licenses, bans and sources. `cargo audit` checks the RustSec advisory database
# against Cargo.lock. Both run on changes to the lockfile or the policy, weekly for new advisories,
# and on demand.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/rust-audit.yml"
  push:
    branches: [migration/rust]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/rust-audit.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo deny and cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the audit tools at pinned versions
        run: cargo install --locked cargo-audit@0.23.0 cargo-deny@0.20.2

      - name: Check the dependency policy
        run: cargo deny check

      - name: Check the lockfile against the advisory database
        run: cargo audit
