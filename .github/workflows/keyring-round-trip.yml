name: Keyring round trip

# The vault's real operating system store, on the three platforms. The ignored test in
# crates/noct-secrets/tests/os_store.rs writes a 3 KB secret through the vault and removes what it
# created. It runs under its own service name, so it never touches an installed application's key.

on:
  pull_request:
    paths:
      - "crates/noct-secrets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/keyring-round-trip.yml"
  push:
    branches: [migration/rust]
    paths:
      - "crates/noct-secrets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/keyring-round-trip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round-trip:
    name: Keyring round trip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Secret Service (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus

      - name: Unit tests
        shell: bash
        run: cargo test -p noct-secrets

      - name: Round trip in a private session (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # A private session bus, with an unlocked login collection that holds no real secret.
          # The daemon reads the login password from stdin. A line feed is an empty password. Without
          # it, the daemon asks for a password through a prompt that a headless runner cannot show,
          # and the first write fails with SecureStorageUnavailable.
          # The $(...) below must expand inside the private session, not in this shell, so the
          # single quotes are intended. shellcheck reports them as SC2016 for this command only.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -c '
            set -euo pipefail
            eval "$(printf '\''\n'\'' | gnome-keyring-daemon --daemonize --login --components=secrets)"
            cargo test -p noct-secrets --test os_store -- --ignored --nocapture
          '

      - name: Round trip in the operating system store (Windows and macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: cargo test -p noct-secrets --test os_store -- --ignored --nocapture
