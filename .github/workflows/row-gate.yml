name: Row gate

# The Rust persistence layer is checked against the databases that every pinned release line writes. The gate
# compiles the TypeScript sources of each tag, seeds synthetic data, and compares the rows that the Rust layer
# reads and writes. The release-line bases need the tags of the repository, and the job uses no secret.
#
# This workflow is not a required check: making it required is a setting of the repository, not of this file.
on:
  push:
    branches:
      - main
      - migration/rust
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: row-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  row-gate:
    name: Row gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository with its tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Each pinned release line is compiled from its tag and checked against the digest of its sources.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install the Node dependencies
        run: npm ci

      - name: Check the pinned toolchain
        shell: bash
        run: |
          pinned="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$pinned"
          cargo --version
          test "$(rustc --version | cut -d' ' -f2)" = "$pinned"

      - name: Run the row gate
        run: node scripts/verify-row-gate.mjs
