name: Rust shell validation

# The Rust shell and its interface: the Trunk build of the UI, the workspace tests, the shell's
# Content-Security-Policy checked in Chromium, and the drift checks of the fixtures that Rust shares with
# TypeScript. It runs on pushes to the migration branch only, and by dispatch once this file is on the
# default branch. There is no pull request trigger.

on:
  push:
    branches:
      - migration/rust
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-shell-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Trunk build, workspace tests and shell policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository with its tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The release-line bases are compiled from the sources of each tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Install the Linux packages that Tauri needs
        shell: bash
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -qi 'dl.google.com/linux/chrome' "$source"; then
              sudo rm -f "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libxdo-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install the Node dependencies
        run: npm ci

      - name: Write the release-line bases and the TypeScript outputs for the differential
        run: node scripts/generate-output-differential.mjs

      - name: Add the WebAssembly target and check the pinned toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version
          pinned="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$pinned"
          test "$(rustc --version | cut -d' ' -f2)" = "$pinned"

      - name: Install trunk at a pinned version
        run: cargo install --locked trunk@0.22.1

      - name: Build the interface with trunk
        working-directory: crates/noct-ui
        run: trunk build --release

      - name: Regenerate the Tauri permissions and fail on any difference
        # tauri-build writes crates/noct-app/permissions/autogenerated on every build. A difference means a
        # command or its permission changed without the generated files being committed. The check covers
        # new files too, which `git diff` alone would miss.
        run: |
          cargo build -p noct-app
          drift="$(git status --porcelain -- crates/noct-app/permissions)"
          if [ -n "$drift" ]; then
            echo "The generated permissions differ from the committed ones. Commit the regenerated files:"
            echo "$drift"
            git --no-pager diff -- crates/noct-app/permissions
            exit 1
          fi

      - name: Run the workspace tests
        run: cargo test --workspace

      - name: Compare the four first-slice outputs with TypeScript over the nine release lines
        run: cargo test -p noct-app --test output_differential -- --ignored

      - name: Install the Chromium of Playwright
        run: npx playwright install --with-deps chromium

      - name: Check the shell Content-Security-Policy in Chromium
        run: node scripts/check-shell-csp.mjs

      - name: Check the settings area with a mocked shell in Chromium
        run: node scripts/check-shell-ui.mjs

      - name: Check the log redaction fixture against TypeScript
        run: node scripts/generate-log-redaction-fixture.mjs --check

      - name: Check the IPC contract samples against zod and TypeScript
        run: node scripts/generate-ipc-samples.mjs --check
