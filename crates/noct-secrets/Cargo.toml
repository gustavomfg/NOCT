[package]
name = "noct-secrets"
description = "NOCT provider credentials. Secrets stay in the operating system credential store; the application keeps opaque references only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keyring-core = "1.0.1"
noct-core = { path = "../noct-core" }
secrecy = "0.10.3"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
