[package]
name = "noct-app"
description = "NOCT desktop shell on Tauri 2. Privileged commands live here; the UI runs in the webview."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
noct-core = { path = "../noct-core" }
noct-db = { path = "../noct-db" }
noct-secrets = { path = "../noct-secrets" }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tauri.workspace = true
tauri-plugin-updater.workspace = true
thiserror.workspace = true
uuid.workspace = true
reqwest.workspace = true
rustls.workspace = true

[features]
# Serves the interface from the embedded frontend instead of the dev URL. Tauri's own CLI enables it for
# production builds; without it a release build would load `build.devUrl`. The release mode of
# scripts/run-rust-shell.mjs enables it.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# The mock runtime of Tauri drives the commands through the capabilities, without a display.
tauri = { workspace = true, features = ["test"] }

[build-dependencies]
tauri-build.workspace = true
