[package]
name = "noct-app"
description = "NOCT desktop shell on Tauri 2. Privileged commands live here; the UI runs in the webview."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
noct-core = { path = "../noct-core" }
noct-db = { path = "../noct-db" }
serde.workspace = true
tauri.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The mock runtime of Tauri drives the commands through the capabilities, without a display.
tauri = { workspace = true, features = ["test"] }

[build-dependencies]
tauri-build.workspace = true
