     the committed value is not "on". -->

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>NOCT</title>
    <link data-trunk rel="copy-file" href="bootstrap.js" />
    <link data-trunk rel="copy-file" href="shell.css" />
    <link rel="stylesheet" href="shell.css" />
    <link
      data-trunk
      rel="rust"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
  </head>
  <body></body>
</html>
