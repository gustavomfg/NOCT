[package]
name = "noct-ui"
description = "NOCT interface in Leptos (CSR, compiled to WebAssembly with trunk)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
leptos = { version = "0.8.23", features = ["csr"] }
noct-core = { path = "../noct-core" }
# Both crates are already in Cargo.lock through Leptos and the workspace; they are named here because the
# interface calls the shell's commands through the page's own JavaScript (crates/noct-ui/src/ipc.rs).
serde_json.workspace = true
wasm-bindgen = "0.2.130"
