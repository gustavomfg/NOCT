[package]
name = "noct-db"
description = "NOCT local persistence: SQLite runtime, schema migrations and repositories (port of electron/database)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
noct-core = { path = "../noct-core" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
sha2.workspace = true
# The authorizer hook, to fail one statement in a test. Dev-only: the application build does not get it.
rusqlite = { workspace = true, features = ["hooks"] }
