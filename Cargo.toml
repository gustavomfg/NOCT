[workspace]
resolver = "3"
members = ["crates/noct-app", "crates/noct-core", "crates/noct-native"]

[workspace.package]
version = "1.0.5"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tauri-build = "2.7.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
